name: Deploy a Cloudflare Pages

# Se activa cuando haces push a la rama master
on:
  push:
    branches:
      - master
  workflow_dispatch: {}  # Permite ejecutar manualmente desde la pestaña Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Desplegar a Cloudflare Pages
      #    El action oficial crea el proyecto automáticamente si no existe
      - name: Desplegar a Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: medicarelectronic
          directory: .
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4'
